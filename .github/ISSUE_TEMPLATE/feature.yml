name: Feature
description: Propose new functionality, written as a user story with testable acceptance criteria.
labels: ["feature"]
body:
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: "As a [role], I want [capability], so that [benefit]."
      placeholder: "As a policy analyst, I want ..., so that ..."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Testable conditions, written as a checklist. Each one should be provable by a test.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: The data finding, footnote or decision this comes from, if any.
    validations:
      required: false